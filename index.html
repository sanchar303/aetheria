<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aetheria</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }
    #worldCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #090d16;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div id="app" class="relative w-full h-full overflow-hidden select-none">
    <!-- Full-Viewport Infinite Open-World Canvas -->
    <canvas id="worldCanvas"></canvas>

    <!-- Top HUD Bar -->
    <header class="pointer-events-none absolute top-0 left-0 right-0 z-20 flex flex-wrap items-start justify-between gap-2 p-2.5 sm:p-4">
      <!-- Left: Identity, 4-Digit Peer ID & Telemetry -->
      <div class="pointer-events-auto flex flex-col gap-1.5 max-w-full">
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 bg-slate-900/85 backdrop-blur-md border border-slate-700/70 rounded-2xl px-2.5 py-1.5 shadow-xl">
          <div class="flex items-center gap-1.5 pr-1">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
            <span class="font-bold tracking-tight text-sm text-white">Aetheria</span>
          </div>

          <div class="flex items-center gap-1 bg-slate-950/90 border border-slate-800 rounded-xl px-2 py-1">
            <span class="text-[11px] uppercase tracking-wider text-slate-400">ID</span>
            <span id="myPeerCode" class="font-mono-code text-xs sm:text-sm font-bold text-sky-400 tracking-widest">----</span>
            <button
              id="copyIdBtn"
              type="button"
              title="Copy 4-digit Peer ID"
              class="ml-1 px-1.5 py-0.5 rounded-lg bg-sky-500/20 hover:bg-sky-500/35 active:scale-95 text-sky-300 text-[11px] font-medium transition"
            >
              Copy
            </button>
          </div>

          <div class="flex items-center gap-1 bg-slate-950/90 border border-slate-800 rounded-xl p-0.5">
            <input
              id="remoteCodeInput"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              placeholder="4-digit ID"
              aria-label="Remote 4-digit Peer ID"
              class="font-mono-code w-20 sm:w-24 bg-transparent px-2 py-1 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none tracking-widest"
            />
            <button
              id="connectPeerBtn"
              type="button"
              class="px-2.5 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-semibold text-xs transition"
            >
              Link
            </button>
          </div>

          <div class="flex items-center gap-2 bg-slate-950/80 border border-slate-800 rounded-xl px-2.5 py-1 text-xs">
            <span id="peerCountText" class="font-semibold text-emerald-300">0 peers</span>
            <span class="text-slate-600">•</span>
            <span class="font-semibold text-indigo-300">4 NPCs</span>
            <span class="text-slate-600">•</span>
            <span id="shardsText" class="font-mono-code font-bold text-amber-300">0 ★</span>
            <span class="text-slate-600">•</span>
            <span id="coordsText" class="font-mono-code text-slate-400 hidden md:inline">0, 0</span>
          </div>
        </div>

        <!-- Dash Energy Gauge + Hull/Gun/Kills Telemetry -->
        <div class="flex flex-wrap items-center gap-2">
          <div class="flex items-center gap-2 bg-slate-900/85 backdrop-blur-md border border-slate-700/70 rounded-xl px-2.5 py-1 shadow-lg">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-cyan-300">Dash</span>
            <div class="w-24 sm:w-32 h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
              <div id="dashEnergyBar" class="h-full w-0 bg-gradient-to-r from-cyan-400 to-sky-300 transition-all duration-100"></div>
            </div>
            <span id="dashEnergyLabel" class="font-mono-code text-[11px] font-bold text-cyan-200">0%</span>
          </div>

          <div class="flex items-center gap-2 bg-slate-950/80 border border-slate-800 rounded-xl px-2.5 py-1 text-xs">
            <span id="hullText" class="font-mono-code font-bold text-rose-400">HP 100/100 • 12/12</span>
            <span class="text-slate-600">|</span>
            <span id="weaponBadge" class="font-mono-code font-bold text-emerald-300">SAFE (NO FIRE)</span>
            <span class="text-slate-600">|</span>
            <span id="killsText" class="font-mono-code font-bold text-violet-300">0 KILLS</span>
          </div>
        </div>

        <!-- Active Powerups Strip -->
        <div id="powerupsStrip" class="pointer-events-none flex flex-wrap items-center gap-1.5 max-w-[74vw] sm:max-w-none min-h-[24px]"></div>
      </div>

      <!-- Right: Minimap & Action Controls -->
      <div class="pointer-events-auto flex items-start gap-2">
        <div class="hidden sm:flex flex-col items-center bg-slate-900/85 backdrop-blur-md border border-slate-700/70 rounded-2xl p-1.5 shadow-xl">
          <canvas id="minimapCanvas" width="108" height="108" class="rounded-xl bg-slate-950 border border-slate-800"></canvas>
          <span class="text-[10px] text-slate-400 mt-1 tracking-wide">SECTOR RADAR</span>
        </div>

        <div class="flex items-center gap-1.5 bg-slate-900/85 backdrop-blur-md border border-slate-700/70 rounded-2xl p-1.5 shadow-xl">
          <button
            id="dashBtn"
            type="button"
            disabled
            title="Dash (Space / Shift) — Requires 100% Dash Energy"
            class="px-2.5 py-1.5 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/35 disabled:opacity-40 disabled:pointer-events-none active:scale-95 text-cyan-200 border border-cyan-400/30 text-xs font-bold transition"
          >
            Dash
          </button>
          <button
            id="beaconBtn"
            type="button"
            title="Deploy Resonance Beacon (E) — Costs 2 Shards & Cooldown | Heal, Pulse, Pull Shards & Rally NPCs"
            class="p-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/35 active:scale-95 text-amber-300 border border-amber-400/30 transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </button>
          <button
            id="soundToggleBtn"
            type="button"
            title="Toggle Sound Effects"
            class="p-2 rounded-xl hover:bg-slate-800 active:scale-95 text-slate-200 transition"
          >
            <svg id="soundOnIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            </svg>
            <svg id="soundOffIcon" class="w-4 h-4 hidden text-rose-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
            </svg>
          </button>
          <button
            id="chatToggleBtn"
            type="button"
            title="Toggle P2P Comms"
            class="relative p-2 rounded-xl hover:bg-slate-800 active:scale-95 text-slate-200 transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
            </svg>
            <span id="unreadBadge" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-sky-400"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Toast Notification Banner -->
    <div id="toastBanner" class="pointer-events-none fixed top-24 left-1/2 -translate-x-1/2 z-30 opacity-0 transition-opacity duration-200">
      <div id="toastText" class="bg-slate-900/95 border border-sky-400/40 text-sky-100 text-xs sm:text-sm font-medium px-4 py-2 rounded-full shadow-2xl backdrop-blur-md"></div>
    </div>

    <!-- Collapsible P2P Chat Drawer -->
    <aside id="chatDrawer" class="hidden fixed top-20 right-2.5 sm:right-4 z-30 w-[calc(100vw-1.25rem)] max-w-xs sm:max-w-sm bg-slate-900/92 backdrop-blur-xl border border-slate-700/80 rounded-2xl shadow-2xl flex flex-col overflow-hidden" style="max-height: min(420px, 58vh);">
      <div class="flex items-center justify-between px-3.5 py-2.5 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-300">P2P Comms</span>
          <span id="chatPeerSummary" class="text-[11px] text-slate-400">No peers linked</span>
        </div>
        <button id="closeChatBtn" type="button" class="text-slate-400 hover:text-white p-1 rounded-lg">✕</button>
      </div>
      <div id="chatMessages" class="custom-scroll flex-1 overflow-y-auto p-3 space-y-2 text-xs">
        <div class="text-slate-400 italic text-center py-4">Share your 4-digit ID or enter a peer's 4-digit ID to chat directly over WebRTC.</div>
      </div>
      <form id="chatForm" class="flex items-center gap-1.5 p-2.5 border-t border-slate-800 bg-slate-950/60">
        <input
          id="chatInput"
          type="text"
          maxlength="240"
          placeholder="Send a message to linked peers..."
          class="flex-1 bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-400"
        />
        <button
          type="submit"
          class="px-3 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-95 text-slate-950 font-semibold text-xs transition"
        >
          Send
        </button>
      </form>
    </aside>

    <!-- Virtual Touch Joystick (Mobile / Touch Devices) -->
    <div id="joystickZone" class="sm:hidden fixed bottom-20 left-5 z-20 w-28 h-28 rounded-full bg-slate-900/55 border border-slate-700/70 backdrop-blur-sm flex items-center justify-center shadow-lg">
      <div id="joystickKnob" class="w-11 h-11 rounded-full bg-sky-400/80 border-2 border-white/70 shadow-md transform transition-transform duration-75"></div>
    </div>

    <!-- Bottom Quick Emote & Controls Bar -->
    <footer class="pointer-events-none fixed bottom-3 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1.5 sm:gap-2 bg-slate-900/85 backdrop-blur-md border border-slate-700/70 rounded-2xl px-2.5 py-1.5 shadow-xl">
      <button data-emote="👋" type="button" class="emote-btn pointer-events-auto w-9 h-9 rounded-xl hover:bg-slate-800 active:scale-90 flex items-center justify-center text-lg transition" title="Wave">👋</button>
      <button data-emote="✨" type="button" class="emote-btn pointer-events-auto w-9 h-9 rounded-xl hover:bg-slate-800 active:scale-90 flex items-center justify-center text-lg transition" title="Sparkle">✨</button>
      <button data-emote="🧭" type="button" class="emote-btn pointer-events-auto w-9 h-9 rounded-xl hover:bg-slate-800 active:scale-90 flex items-center justify-center text-lg transition" title="Explore">🧭</button>
      <button data-emote="⚡" type="button" class="emote-btn pointer-events-auto w-9 h-9 rounded-xl hover:bg-slate-800 active:scale-90 flex items-center justify-center text-lg transition" title="Surge">⚡</button>
      <div class="h-5 w-px bg-slate-800 mx-0.5 hidden sm:block"></div>
      <span class="hidden sm:inline text-[11px] text-slate-400 pr-1">WASD/Arrows roam • Auto-aim/fire in range • Space Dash • E Beacon (2★)</span>
    </footer>
  </div>

  <script>
    const SECTOR_SIZE = 700;
    const BROADCAST_INTERVAL_MS = 50;
    const DASH_ENERGY_MAX = 100;
    const BEACON_RADIUS = 250;
    const BEACON_DURATION_MS = 24000;
    const BEACON_SHARD_COST = 2;
    const BEACON_COOLDOWN_MS = 14000;
    const SAFE_ZONE_RADIUS = 290;
    const AETHER_PREFIX = 'AETH-P2P-';

    const GUN_SPECS = {
      pulse: {
        id: 'pulse',
        label: 'PULSE',
        color: '#38bdf8',
        fireInterval: 0.40,
        magSize: 12,
        reloadDuration: 1.3,
        speed: 630,
        baseDmg: 22,
        pellets: 1,
        spread: 0
      },
      scatter: {
        id: 'scatter',
        label: 'SCATTER',
        color: '#fb923c',
        fireInterval: 0.68,
        magSize: 6,
        reloadDuration: 1.55,
        speed: 540,
        baseDmg: 14,
        pellets: 4,
        spread: 0.24
      },
      rail: {
        id: 'rail',
        label: 'RAIL',
        color: '#c084fc',
        fireInterval: 0.85,
        magSize: 5,
        reloadDuration: 1.65,
        speed: 880,
        baseDmg: 48,
        pellets: 1,
        spread: 0
      }
    };

    const BIOMES = [
      { name: 'Whispering Steppe', accent: '#38bdf8', grid: 'rgba(56, 189, 248, 0.06)' },
      { name: 'Amber Dunes', accent: '#fbbf24', grid: 'rgba(251, 191, 36, 0.06)' },
      { name: 'Emerald Canopy', accent: '#34d399', grid: 'rgba(52, 211, 153, 0.06)' },
      { name: 'Violet Rift', accent: '#c084fc', grid: 'rgba(192, 132, 252, 0.06)' }
    ];

    const AURA_COLORS = ['#38bdf8', '#34d399', '#fbbf24', '#f472b6', '#a78bfa', '#fb7185', '#2dd4bf'];
    const randomAdj = ['Swift', 'Calm', 'Bright', 'Nova', 'Solar', 'Lunar', 'Drift', 'Echo'];
    const randomNoun = ['Voyager', 'Drifter', 'Nomad', 'Seeker', 'Ranger', 'Weaver', 'Strider', 'Beacon'];

    function generateFourDigitCode() {
      return String(Math.floor(1000 + Math.random() * 9000));
    }

    function normalizeFourDigitCode(raw) {
      const digits = String(raw || '').replace(/\D/g, '').slice(0, 4);
      return digits.length === 4 ? digits : null;
    }

    const SoundFX = (() => {
      let ctx = null;
      let enabled = true;

      function ensureContext() {
        if (!enabled) return null;
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function tone(freq, endFreq, duration, type = 'sine', gainVal = 0.06) {
        const c = ensureContext();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq !== null) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
        }
        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      return {
        pickup() { tone(520, 880, 0.14, 'triangle', 0.07); },
        beacon() {
          tone(330, 660, 0.22, 'sine', 0.07);
          setTimeout(() => tone(660, 990, 0.26, 'triangle', 0.06), 90);
        },
        dash() { tone(240, 620, 0.16, 'sawtooth', 0.05); },
        laser() { tone(780, 260, 0.09, 'sawtooth', 0.035); },
        hit() { tone(210, 95, 0.08, 'square', 0.04); },
        kill() {
          tone(440, 140, 0.18, 'sawtooth', 0.06);
          setTimeout(() => tone(587, 880, 0.14, 'triangle', 0.05), 70);
        },
        message() { tone(587.33, 783.99, 0.11, 'sine', 0.05); },
        connect() {
          tone(440, 554.37, 0.12, 'sine', 0.06);
          setTimeout(() => tone(554.37, 659.25, 0.16, 'sine', 0.06), 100);
        },
        setEnabled(val) {
          enabled = val;
        },
        isEnabled() {
          return enabled;
        }
      };
    })();

    const seedNum = Math.floor(Math.random() * 10000);
    const localPlayer = {
      id: null,
      shortCode: '----',
      name: `${randomAdj[seedNum % randomAdj.length]}_${randomNoun[(seedNum >> 3) % randomNoun.length]}`,
      color: AURA_COLORS[seedNum % AURA_COLORS.length],
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      aimAngle: 0,
      radius: 16,
      baseSpeed: 165,
      speed: 165,
      hp: 100,
      maxHp: 100,
      hpRegen: 1.5,
      weaponId: 'pulse',
      fireInterval: 0.40,
      autoAimRange: 400,
      magSize: 12,
      ammo: 12,
      reloadTimer: 0,
      reloadDuration: 1.3,
      critChance: 0.08,
      critMult: 1.5,
      kills: 0,
      dashEnergy: 0,
      dashTimer: 0,
      fireCooldown: 0,
      shards: 0,
      hitFlash: 0,
      inSafeZone: true,
      powerups: {
        overdrive: 0,
        aegis: 0,
        magnet: 0
      },
      emote: null,
      emoteTimer: 0,
      trail: []
    };

    const remotePeers = new Map();
    const dataConnections = new Map();
    const npcs = [];
    const enemies = [];
    const projectiles = [];
    const shards = [];
    const gunPickups = [];
    const powerupPickups = [];
    const beacons = [];
    const particles = [];
    const damagePopups = [];
    const generatedSectors = new Set();

    let peerInstance = null;
    let toastTimeout = null;
    let idRetryCount = 0;
    let activeColossusCount = 0;
    let lastBeaconDeployTime = -BEACON_COOLDOWN_MS;
    let lastPowerupStripKey = '';

    const keys = new Set();
    const joystickInput = { x: 0, y: 0, active: false };

    function isInSafeZone(x, y) {
      return Math.hypot(x, y) <= SAFE_ZONE_RADIUS;
    }

    function recalculatePlayerStats() {
      const s = localPlayer.shards;
      const gun = GUN_SPECS[localPlayer.weaponId] || GUN_SPECS.pulse;
      const overdriveMult = localPlayer.powerups.overdrive > 0 ? 1.35 : 1.0;

      localPlayer.maxHp = 100 + Math.floor(s / 3) * 15;
      localPlayer.hpRegen = 1.5 + Math.floor(s / 4) * 0.8;
      localPlayer.speed = Math.min(285, (165 + Math.floor(s / 3) * 5) * (localPlayer.powerups.overdrive > 0 ? 1.15 : 1.0));
      localPlayer.fireInterval = Math.max(0.14, (gun.fireInterval - Math.floor(s / 5) * 0.02) / overdriveMult);
      localPlayer.magSize = gun.magSize + Math.floor(s / 4) * 2;
      localPlayer.reloadDuration = gun.reloadDuration;
      localPlayer.critChance = Math.min(0.65, 0.08 + Math.floor(s / 4) * 0.03 + (localPlayer.powerups.overdrive > 0 ? 0.12 : 0));
      localPlayer.critMult = 1.5 + Math.floor(s / 5) * 0.15;
      if (localPlayer.ammo > localPlayer.magSize) localPlayer.ammo = localPlayer.magSize;
      if (localPlayer.hp > localPlayer.maxHp) localPlayer.hp = localPlayer.maxHp;
    }

    function initNPCs() {
      const configs = [
        { code: 'NPC-01', role: 'Scout', color: '#60a5fa', x: 150, y: 90, speed: 125 },
        { code: 'NPC-02', role: 'Harvester', color: '#34d399', x: -165, y: 110, speed: 110 },
        { code: 'NPC-03', role: 'Vanguard', color: '#f472b6', x: 140, y: -150, speed: 118 },
        { code: 'NPC-04', role: 'Pathfinder', color: '#c084fc', x: -155, y: -135, speed: 122 }
      ];
      configs.forEach((cfg, idx) => {
        npcs.push({
          id: `npc_${idx + 1}`,
          code: cfg.code,
          role: cfg.role,
          color: cfg.color,
          x: cfg.x,
          y: cfg.y,
          vx: 0,
          vy: 0,
          radius: 15,
          speed: cfg.speed,
          hp: 110,
          maxHp: 110,
          waypointX: cfg.x,
          waypointY: cfg.y,
          decisionTimer: 0.6 + idx * 0.4,
          fireTimer: 0.8 + idx * 0.25,
          emote: null,
          emoteTimer: 0,
          trail: []
        });
      });
    }

    function hashCoords(cx, cy, salt = 0) {
      let h = Math.imul(cx, 374761393) + Math.imul(cy, 668265263) + Math.imul(salt, 1442695041);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    }

    function getBiomeAt(x, y) {
      const cx = Math.floor(x / SECTOR_SIZE);
      const cy = Math.floor(y / SECTOR_SIZE);
      const idx = Math.abs((cx * 7 + cy * 13) % BIOMES.length);
      return BIOMES[idx];
    }

    function ensureInfiniteSectorsAround(wx, wy) {
      const centerCx = Math.floor(wx / SECTOR_SIZE);
      const centerCy = Math.floor(wy / SECTOR_SIZE);
      const radiusSectors = 2;

      for (let dy = -radiusSectors; dy <= radiusSectors; dy++) {
        for (let dx = -radiusSectors; dx <= radiusSectors; dx++) {
          const cx = centerCx + dx;
          const cy = centerCy + dy;
          const key = `${cx},${cy}`;
          if (generatedSectors.has(key)) continue;
          generatedSectors.add(key);

          const baseX = cx * SECTOR_SIZE;
          const baseY = cy * SECTOR_SIZE;
          const distFromOrigin = Math.hypot(baseX + SECTOR_SIZE / 2, baseY + SECTOR_SIZE / 2);
          const difficultyScale = 1 + Math.min(2.5, distFromOrigin / 4500);

          // Spawn shards in this sector
          const shardCount = 3 + Math.floor(hashCoords(cx, cy, 1) * 3);
          for (let s = 0; s < shardCount; s++) {
            const sx = baseX + 70 + hashCoords(cx, cy, s * 11 + 2) * (SECTOR_SIZE - 140);
            const sy = baseY + 70 + hashCoords(cx, cy, s * 11 + 3) * (SECTOR_SIZE - 140);
            shards.push({
              id: `sh_${cx}_${cy}_${s}`,
              x: sx,
              y: sy,
              active: true,
              respawnTimer: 0,
              phase: hashCoords(cx, cy, s * 11 + 4) * Math.PI * 2
            });
          }

          // Keep immediate spawn origin lighter so new explorers can orient
          const sectorDist = Math.hypot(baseX + SECTOR_SIZE / 2, baseY + SECTOR_SIZE / 2);
          if (sectorDist > 480) {
            const packCount = sectorDist > 2200 ? 2 : 1;
            for (let e = 0; e < packCount; e++) {
              const r1 = hashCoords(cx, cy, e * 19 + 3);
              const r2 = hashCoords(cx, cy, e * 19 + 4);
              const r3 = hashCoords(cx, cy, e * 19 + 5);
              const ex = baseX + 110 + r1 * (SECTOR_SIZE - 220);
              const ey = baseY + 110 + r2 * (SECTOR_SIZE - 220);

              if (isInSafeZone(ex, ey)) continue;

              let variant = 'swarmer';
              if (r3 > 0.92 && sectorDist > 1500 && activeColossusCount < 2) {
                variant = 'colossus';
              } else if (r3 > 0.5) {
                variant = 'stalker';
              }

              spawnEnemyVariant(ex, ey, variant, difficultyScale);
            }
          }

          if (sectorDist > 360 && hashCoords(cx, cy, 77) > 0.45) {
            const gx = baseX + 130 + hashCoords(cx, cy, 78) * (SECTOR_SIZE - 260);
            const gy = baseY + 130 + hashCoords(cx, cy, 79) * (SECTOR_SIZE - 260);
            const gunRoll = hashCoords(cx, cy, 80);
            const gunType = gunRoll > 0.68 ? 'rail' : gunRoll > 0.34 ? 'scatter' : 'pulse';
            gunPickups.push({
              id: `gun_${cx}_${cy}`,
              gunType,
              x: gx,
              y: gy,
              active: true,
              respawnTimer: 0
            });
          }

          if (sectorDist > 340 && hashCoords(cx, cy, 91) > 0.4) {
            const px = baseX + 140 + hashCoords(cx, cy, 92) * (SECTOR_SIZE - 280);
            const py = baseY + 140 + hashCoords(cx, cy, 93) * (SECTOR_SIZE - 280);
            const pRoll = hashCoords(cx, cy, 94);
            const pType = pRoll > 0.66 ? 'magnet' : pRoll > 0.33 ? 'aegis' : 'overdrive';
            powerupPickups.push({
              id: `pw_${cx}_${cy}`,
              type: pType,
              x: px,
              y: py,
              active: true,
              respawnTimer: 0
            });
          }
        }
      }

      const cullRadius = 2450;
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (Math.hypot(enemies[i].x - wx, enemies[i].y - wy) > cullRadius) {
          if (enemies[i].variant === 'Colossus') activeColossusCount = Math.max(0, activeColossusCount - 1);
          enemies.splice(i, 1);
        }
      }
      for (let i = shards.length - 1; i >= 0; i--) {
        if (Math.hypot(shards[i].x - wx, shards[i].y - wy) > cullRadius) {
          shards.splice(i, 1);
        }
      }
      for (let i = gunPickups.length - 1; i >= 0; i--) {
        if (Math.hypot(gunPickups[i].x - wx, gunPickups[i].y - wy) > cullRadius) {
          gunPickups.splice(i, 1);
        }
      }
      for (let i = powerupPickups.length - 1; i >= 0; i--) {
        if (Math.hypot(powerupPickups[i].x - wx, powerupPickups[i].y - wy) > cullRadius) {
          powerupPickups.splice(i, 1);
        }
      }
    }

    function spawnParticles(x, y, color, count = 10, speedScale = 1) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const speed = (40 + Math.random() * 110) * speedScale;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          size: 2 + Math.random() * 2.5,
          life: 0.45 + Math.random() * 0.35,
          maxLife: 0.8
        });
      }
    }

      projectiles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        damage,
        ownerType,
        color,
        isCrit,
        life: 1.15
      });

    function addDamagePopup(x, y, amount, color = '#fde047', isCrit = false) {
      damagePopups.push({
        x,
        y,
        vy: -42,
        text: isCrit ? `-${Math.round(amount)}!` : `-${Math.round(amount)}`,
        color,

      });

    function applyDamageToLocalPlayer(rawDmg, sourceColor = '#f43f5e') {
      if (localPlayer.inSafeZone || localPlayer.dashTimer > 0) return;
      const dmgMult = localPlayer.powerups.aegis > 0 ? 0.35 : 1.0;
      const finalDmg = rawDmg * dmgMult;
      localPlayer.hp -= finalDmg;
      localPlayer.hitFlash = 1;
      spawnParticles(localPlayer.x, localPlayer.y, sourceColor, 6, 0.75);
      if (localPlayer.hp <= 0) {
        localPlayer.hp = localPlayer.maxHp;
        localPlayer.ammo = localPlayer.magSize;
        localPlayer.x = 0;
        localPlayer.y = 0;
        showToast('Hull breached! Reconstructed inside Safe Zone.');
      }
    }

    function triggerDash() {
      if (localPlayer.dashEnergy < DASH_ENERGY_MAX || localPlayer.dashTimer > 0) {
        showToast('Dash needs 100% Dash Energy!');
        return;
      }
      localPlayer.dashEnergy = 0;
      localPlayer.dashTimer = 0.22;

      const angle = Math.hypot(localPlayer.vx, localPlayer.vy) > 10
        ? Math.atan2(localPlayer.vy, localPlayer.vx)
        : localPlayer.aimAngle;
      const dashSpeed = Math.max(460, localPlayer.speed * 2.6);
      localPlayer.vx = Math.cos(angle) * dashSpeed;
      localPlayer.vy = Math.sin(angle) * dashSpeed;

      SoundFX.dash();
      spawnParticles(localPlayer.x, localPlayer.y, localPlayer.color, 14, 1.2);
      updateCombatAndEnergyUI();
    }

    function triggerBeacon() {
      const now = performance.now();
      const remainingMs = BEACON_COOLDOWN_MS - (now - lastBeaconDeployTime);
      if (remainingMs > 0) {
        showToast(`Beacon recharging (${(remainingMs / 1000).toFixed(1)}s)`);
        return;
      }
      if (localPlayer.shards < BEACON_SHARD_COST) {
        showToast(`Beacon requires ${BEACON_SHARD_COST} Shards ★`);
        return;
      }

      localPlayer.shards -= BEACON_SHARD_COST;
      recalculatePlayerStats();
      lastBeaconDeployTime = now;

      localPlayer.hp = Math.min(localPlayer.maxHp, localPlayer.hp + 25);

      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        if (Math.hypot(en.x - localPlayer.x, en.y - localPlayer.y) <= BEACON_RADIUS) {
          en.hp -= 35;
          en.hitFlash = 1;
          addDamagePopup(en.x, en.y - 12, 35, '#fbbf24', true);
          if (en.hp <= 0) {
            if (en.variant === 'Colossus') activeColossusCount = Math.max(0, activeColossusCount - 1);
            enemies.splice(i, 1);
            localPlayer.kills += 1;
          }
        }
      }

      addBeacon(localPlayer.x, localPlayer.y, '#fbbf24', `${localPlayer.name} [${localPlayer.shortCode}]`);
      SoundFX.beacon();
      spawnParticles(localPlayer.x, localPlayer.y, '#fbbf24', 20, 1.3);
      showToast('Resonance Beacon deployed! +25 HP, Shockwave, Shard Pull & NPC Rally.');
      broadcastToAll({
        type: 'beacon',
        x: localPlayer.x,
        y: localPlayer.y,
        color: '#fbbf24',
        label: `${localPlayer.name} [${localPlayer.shortCode}]`
      });
      updateCombatAndEnergyUI();
    }

        container.innerHTML = '';
      }
