    function broadcastToAll(payload, excludeCode = null) {
      const msg = JSON.stringify(payload);
      dataConnections.forEach((conn, code) => {
        if (code !== excludeCode && conn.open) {
          try {
            conn.send(msg);
          } catch (err) {
            console.warn('P2P send error:', err);
          }
        }
      });
    }

    function handlePeerData(peerCode, rawData) {
      let payload;
      try {
        payload = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
      } catch (err) {
        return;
      }
      if (!payload || typeof payload !== 'object') return;

      const peer = remotePeers.get(peerCode);
      if (!peer) return;

      switch (payload.type) {
        case 'hello':
          peer.name = payload.name || peer.name;
          peer.color = payload.color || peer.color;
          peer.shards = payload.shards ?? peer.shards;
          if (typeof payload.hp === 'number') peer.hp = payload.hp;
          if (typeof payload.maxHp === 'number') peer.maxHp = payload.maxHp;
          if (Array.isArray(payload.knownPeers)) {
            payload.knownPeers.forEach((otherCode) => {
              if (
                otherCode &&
                otherCode !== localPlayer.shortCode &&
                !dataConnections.has(otherCode) &&
                localPlayer.shortCode > otherCode
              ) {
                connectToPeer(otherCode);
              }
            });
          }
          break;
        case 'state':
          peer.name = payload.name || peer.name;
          peer.color = payload.color || peer.color;
          peer.targetX = payload.x;
          peer.targetY = payload.y;
          peer.shards = payload.shards ?? peer.shards;
          if (typeof payload.hp === 'number') peer.hp = payload.hp;
          if (typeof payload.maxHp === 'number') peer.maxHp = payload.maxHp;
          if (payload.hit) peer.hitFlash = 1;
          break;
        case 'peer_damage':
          if (payload.targetCode === localPlayer.shortCode) {
            applyDamageToLocalPlayer(payload.amount || 14, payload.color || peer.color);
          } else {
            const otherPeer = remotePeers.get(payload.targetCode);
            if (otherPeer) {
              otherPeer.hp = Math.max(0, (otherPeer.hp ?? 100) - (payload.amount || 14));
              otherPeer.hitFlash = 1;
              addDamagePopup(otherPeer.x, otherPeer.y - 16, payload.amount || 14, '#fb7185', !!payload.isCrit);
            }
          }
          break;
        case 'chat':
          SoundFX.message();
          appendChatMessage({
            sender: peer.name,
            code: peerCode,
            text: String(payload.text || '').slice(0, 240),
            color: peer.color,
            self: false
          });
          break;
        case 'emote':
          peer.emote = String(payload.emote || '✨').slice(0, 8);
          peer.emoteTimer = 2.4;
          SoundFX.pickup();
          break;
        case 'beacon':
          addBeacon(payload.x, payload.y, payload.color || peer.color, payload.label || `${peer.name} [${peerCode}]`);
          SoundFX.beacon();
          spawnParticles(payload.x, payload.y, payload.color || peer.color, 18, 1.2);
          showToast(`${peer.name} [${peerCode}] deployed a Resonance Beacon!`);
          break;
        case 'shard_claim': {
          const s = shards.find((item) => item.id === payload.shardId);
          if (s && s.active) {
            s.active = false;
            s.respawnTimer = 18;
            spawnParticles(s.x, s.y, '#fbbf24', 8, 0.7);
          }
          break;
        }
        default:
          break;
      }
    }

    function setupDataConnection(conn, targetCode) {
      dataConnections.set(targetCode, conn);
      if (!remotePeers.has(targetCode)) {
        remotePeers.set(targetCode, {
          code: targetCode,
          shortCode: targetCode,
          name: `Explorer_${targetCode}`,
          color: AURA_COLORS[parseInt(targetCode, 10) % AURA_COLORS.length],
          x: 0,
          y: 0,
          targetX: 0,
          targetY: 0,
          radius: 16,
          hp: 100,
          maxHp: 100,
          hitFlash: 0,
          shards: 0,
          emote: null,
          emoteTimer: 0,
          trail: []
        });
      }
      updateConnectionUI('connected');

      conn.on('open', () => {
        SoundFX.connect();
        updateConnectionUI('connected');
        showToast(`Linked with Peer ${targetCode}`);
        conn.send(JSON.stringify({
          type: 'hello',
          name: localPlayer.name,
          color: localPlayer.color,
          shards: localPlayer.shards,
          hp: Math.round(localPlayer.hp),
          maxHp: Math.round(localPlayer.maxHp),
          knownPeers: Array.from(dataConnections.keys())
        }));
      });

      conn.on('data', (data) => handlePeerData(targetCode, data));

      conn.on('close', () => {
        dataConnections.delete(targetCode);
        remotePeers.delete(targetCode);
        updateConnectionUI(localPlayer.shortCode !== '----' ? 'ready' : 'error');
        showToast(`Peer ${targetCode} disconnected`);
      });

      conn.on('error', () => {
        dataConnections.delete(targetCode);
        remotePeers.delete(targetCode);
        updateConnectionUI(localPlayer.shortCode !== '----' ? 'ready' : 'error');
      });
    }

    function connectToPeer(rawCode) {
      const targetCode = normalizeFourDigitCode(rawCode);
      if (!targetCode) {
        showToast('Enter a valid 4-digit Peer ID.');
        return;
      }
      if (targetCode === localPlayer.shortCode) {
        showToast('That is your own 4-digit Peer ID.');
        return;
      }
      if (dataConnections.has(targetCode)) {
        showToast(`Already linked with ${targetCode}`);
        return;
      }
      if (!peerInstance || peerInstance.disconnected) {
        showToast('P2P engine not ready yet. Retrying...');
        initPeer();
        return;
      }

      showToast(`Linking to ${targetCode}...`);
      const conn = peerInstance.connect(`${AETHER_PREFIX}${targetCode}`, { reliable: true });
      if (conn) {
        setupDataConnection(conn, targetCode);
      }
    }

    function initPeer() {
      if (typeof Peer === 'undefined') {
        updateConnectionUI('error');
        showToast('PeerJS library unavailable.');
        return;
      }

      const code = generateFourDigitCode();
      const fullId = `${AETHER_PREFIX}${code}`;
      updateConnectionUI('connecting');

      try {
        peerInstance = new Peer(fullId, { debug: 0 });
      } catch (err) {
        updateConnectionUI('error');
        showToast('Failed to initialize PeerJS.');
        return;
      }

      peerInstance.on('open', (id) => {
        idRetryCount = 0;
        const cleanCode = id.replace(AETHER_PREFIX, '');
        localPlayer.id = id;
        localPlayer.shortCode = cleanCode;
        document.getElementById('myPeerCode').textContent = cleanCode;
        updateConnectionUI('ready');
      });

      peerInstance.on('connection', (conn) => {
        const remoteCode = normalizeFourDigitCode(conn.peer.replace(AETHER_PREFIX, '')) || '0000';
        setupDataConnection(conn, remoteCode);
      });

      peerInstance.on('error', (err) => {
        if (err && err.type === 'unavailable-id' && idRetryCount < 6) {
          idRetryCount += 1;
          peerInstance.destroy();
          initPeer();
          return;
        }
        if (err && err.type === 'peer-unavailable') {
          showToast('4-digit Peer ID not found online.');
        } else {
          updateConnectionUI('error');
          showToast('P2P connection notice: check network.');
        }
      });
    }

    function getNearestHostileForPlayer() {
      if (localPlayer.inSafeZone) return null;

      let bestTarget = null;
      let bestDist = localPlayer.autoAimRange;

      for (const en of enemies) {
        if (isInSafeZone(en.x, en.y)) continue;
        const d = Math.hypot(en.x - localPlayer.x, en.y - localPlayer.y);
        if (d < bestDist) {
          bestDist = d;
          bestTarget = { kind: 'enemy', entity: en };
        }
      }

      for (const npc of npcs) {
        if (isInSafeZone(npc.x, npc.y)) continue;
        const d = Math.hypot(npc.x - localPlayer.x, npc.y - localPlayer.y);
        if (d < bestDist) {
          bestDist = d;
          bestTarget = { kind: 'npc', entity: npc };
        }
      }

      remotePeers.forEach((peer, code) => {
        if (isInSafeZone(peer.x, peer.y)) return;
        const d = Math.hypot(peer.x - localPlayer.x, peer.y - localPlayer.y);
        if (d < bestDist) {
          bestDist = d;
          bestTarget = { kind: 'peer', code, entity: peer };
        }
      });

      return bestTarget;
    }

    function updatePlayerAutoCombat(dt) {
      if (localPlayer.fireCooldown > 0) localPlayer.fireCooldown = Math.max(0, localPlayer.fireCooldown - dt);

      if (localPlayer.inSafeZone) {
        localPlayer.ammo = localPlayer.magSize;
        localPlayer.reloadTimer = 0;
        return;
      }

      if (localPlayer.reloadTimer > 0) {
        localPlayer.reloadTimer -= dt;
        if (localPlayer.reloadTimer <= 0) {
          localPlayer.reloadTimer = 0;
          localPlayer.ammo = localPlayer.magSize;
        }
        return;
      }

      if (localPlayer.ammo <= 0) {
        localPlayer.reloadTimer = localPlayer.reloadDuration;
        return;
      }

      const targetInfo = getNearestHostileForPlayer();
      if (!targetInfo) return;

      const baseAngle = Math.atan2(targetInfo.entity.y - localPlayer.y, targetInfo.entity.x - localPlayer.x);
      localPlayer.aimAngle = baseAngle;

      if (localPlayer.fireCooldown <= 0) {
        const gun = GUN_SPECS[localPlayer.weaponId] || GUN_SPECS.pulse;
        localPlayer.fireCooldown = localPlayer.fireInterval;
        localPlayer.ammo = Math.max(0, localPlayer.ammo - 1);
        if (localPlayer.ammo === 0) {
          localPlayer.reloadTimer = localPlayer.reloadDuration;
        }

        for (let p = 0; p < gun.pellets; p++) {
          const offset = gun.pellets > 1
            ? ((p / (gun.pellets - 1)) - 0.5) * gun.spread
            : (Math.random() - 0.5) * gun.spread;
          const isCrit = Math.random() < localPlayer.critChance;
          const dmg = Math.round(gun.baseDmg * (isCrit ? localPlayer.critMult : 1));
          spawnProjectile(
            localPlayer.x + Math.cos(baseAngle + offset) * 20,
            localPlayer.y + Math.sin(baseAngle + offset) * 20,
            baseAngle + offset,
            gun.speed,
            dmg,
            'player',
            isCrit ? '#fde047' : gun.color,
            isCrit
          );
        }
        SoundFX.laser();
      }
    }

    function updateNPCs(dt) {
      for (const npc of npcs) {
        if (npc.hp <= 0) {
          npc.hp = npc.maxHp;
          npc.x = localPlayer.x + (Math.random() - 0.5) * 340;
          npc.y = localPlayer.y + (Math.random() - 0.5) * 340;
          npc.emote = '♻️';
          npc.emoteTimer = 2.0;
        }
        npc.fireTimer -= dt;
        npc.decisionTimer -= dt;
        if (npc.emoteTimer > 0) {
          npc.emoteTimer -= dt;
          if (npc.emoteTimer <= 0) npc.emote = null;
        }

        let colossusTarget = null;
        let colossusDist = 750;
        let nearestAnyEnemy = null;
        let anyEnemyDist = 440;

        for (const en of enemies) {
          const d = Math.hypot(en.x - npc.x, en.y - npc.y);
          if (en.variant === 'Colossus' && d < colossusDist) {
            colossusDist = d;
            colossusTarget = en;
          }
          if (d < anyEnemyDist) {
            anyEnemyDist = d;
            nearestAnyEnemy = en;
          }
        }

        const priorityEnemy = colossusTarget || nearestAnyEnemy;
        const playerDist = Math.hypot(localPlayer.x - npc.x, localPlayer.y - npc.y);
        const canEngagePlayer = playerDist < 360 && !localPlayer.inSafeZone && !isInSafeZone(npc.x, npc.y);

        if (priorityEnemy) {
          const dx = priorityEnemy.x - npc.x;
          const dy = priorityEnemy.y - npc.y;
          const dist = Math.max(1, Math.hypot(dx, dy));
          const ang = Math.atan2(dy, dx);
          const desiredRange = priorityEnemy.variant === 'Colossus' ? 210 : 165;
          if (dist > desiredRange) {
            npc.vx = (dx / dist) * npc.speed;
            npc.vy = (dy / dist) * npc.speed;
          } else {
            npc.vx *= 0.82;
            npc.vy *= 0.82;
          }
          if (npc.fireTimer <= 0 && !isInSafeZone(npc.x, npc.y)) {
            npc.fireTimer = priorityEnemy.variant === 'Colossus' ? 0.48 : 0.62;
            spawnProjectile(
              npc.x + Math.cos(ang) * 16,
              npc.y + Math.sin(ang) * 16,
              ang,
              500,
              15,
              'npc',
              npc.color
            );
          }
        } else if (canEngagePlayer) {
          const dx = localPlayer.x - npc.x;
          const dy = localPlayer.y - npc.y;
          const dist = Math.max(1, playerDist);
          const ang = Math.atan2(dy, dx);
          if (dist > 175) {
            npc.vx = (dx / dist) * npc.speed * 0.9;
            npc.vy = (dy / dist) * npc.speed * 0.9;
          } else {
            npc.vx *= 0.82;
            npc.vy *= 0.82;
          }
          if (npc.fireTimer <= 0) {
            npc.fireTimer = 0.72;
            spawnProjectile(
              npc.x + Math.cos(ang) * 16,
              npc.y + Math.sin(ang) * 16,
              ang,
              460,
              9,
              'npc',
              npc.color
            );
          }
        } else {
          if (npc.decisionTimer <= 0) {
            npc.decisionTimer = 2.4 + Math.random() * 2.0;
            const activeBeacon = beacons.length > 0 ? beacons[beacons.length - 1] : null;
            if (activeBeacon) {
              const a = Math.random() * Math.PI * 2;
              npc.waypointX = activeBeacon.x + Math.cos(a) * 95;
              npc.waypointY = activeBeacon.y + Math.sin(a) * 95;
            } else {
              const a = Math.random() * Math.PI * 2;
              const r = 140 + Math.random() * 340;
              npc.waypointX = localPlayer.x + Math.cos(a) * r;
              npc.waypointY = localPlayer.y + Math.sin(a) * r;
            }
          }
          const dx = npc.waypointX - npc.x;
          const dy = npc.waypointY - npc.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 10) {
            npc.vx = (dx / dist) * npc.speed * 0.8;
            npc.vy = (dy / dist) * npc.speed * 0.8;
          } else {
            npc.vx *= 0.85;
            npc.vy *= 0.85;
          }
        }

        npc.x += npc.vx * dt;
        npc.y += npc.vy * dt;

        if (Math.hypot(npc.vx, npc.vy) > 20) {
          npc.trail.push({ x: npc.x, y: npc.y, alpha: 0.25 });
        }
        for (let i = npc.trail.length - 1; i >= 0; i--) {
          npc.trail[i].alpha -= dt * 1.7;
          if (npc.trail[i].alpha <= 0) npc.trail.splice(i, 1);
        }
      }
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        if (en.hitFlash > 0) {
          en.hitFlash = Math.max(0, en.hitFlash - dt * 6);
        }
        en.fireTimer -= dt;

        let targetX = null;
        let targetY = null;
        let bestDist = 680;

        if (!localPlayer.inSafeZone) {
          const pd = Math.hypot(localPlayer.x - en.x, localPlayer.y - en.y);
          if (pd < bestDist) {
            bestDist = pd;
            targetX = localPlayer.x;
            targetY = localPlayer.y;
          }
        }

        for (const npc of npcs) {
          const d = Math.hypot(npc.x - en.x, npc.y - en.y);
          if (d < bestDist) {
            bestDist = d;
            targetX = npc.x;
            targetY = npc.y;
          }
        }

        if (targetX !== null && targetY !== null && !isInSafeZone(en.x, en.y)) {
          const dx = targetX - en.x;
          const dy = targetY - en.y;
          const dist = Math.max(1, bestDist);
          const ang = Math.atan2(dy, dx);

          const stopDist = en.variant === 'Colossus' ? 190 : en.variant === 'Stalker' ? 140 : 12;
          if (dist > stopDist) {
            en.vx = (dx / dist) * en.speed;
            en.vy = (dy / dist) * en.speed;
          } else {
            en.vx *= 0.85;
            en.vy *= 0.85;
          }

          en.x += en.vx * dt;
          en.y += en.vy * dt;

          if ((en.variant === 'Colossus' || en.variant === 'Stalker') && en.fireTimer <= 0 && dist < 440) {
            en.fireTimer = en.variant === 'Colossus' ? 1.85 : 2.1;
            const dmg = en.variant === 'Colossus' ? 16 : 10;
            const spd = en.variant === 'Colossus' ? 320 : 350;
            spawnProjectile(en.x, en.y, ang, spd, dmg, 'enemy', en.color);
          }

          const playerDist = Math.hypot(localPlayer.x - en.x, localPlayer.y - en.y);
          if (playerDist < en.radius + localPlayer.radius && !localPlayer.inSafeZone && localPlayer.dashTimer <= 0) {
            applyDamageToLocalPlayer(en.contactDmg * dt * 2.2, en.color);
          }
        }
      }
    }

    function updateProjectiles(dt) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.x += pr.vx * dt;
        pr.y += pr.vy * dt;
        pr.life -= dt;

        if (pr.life <= 0 || isInSafeZone(pr.x, pr.y)) {
          projectiles.splice(i, 1);
          continue;
        }

        if (pr.ownerType === 'player' || pr.ownerType === 'npc') {
          let hit = false;
          for (let j = enemies.length - 1; j >= 0; j--) {
            const en = enemies[j];
            if (Math.hypot(pr.x - en.x, pr.y - en.y) < en.radius + 6) {
              en.hp -= pr.damage;
              en.hitFlash = 1;
              hit = true;
              addDamagePopup(en.x, en.y - en.radius - 6, pr.damage, pr.isCrit ? '#fde047' : '#fda4af', pr.isCrit);
              spawnParticles(pr.x, pr.y, pr.isCrit ? '#fde047' : en.color, pr.isCrit ? 10 : 6, 0.85);
              if (en.hp <= 0) {
                if (en.variant === 'Colossus') activeColossusCount = Math.max(0, activeColossusCount - 1);
                spawnParticles(en.x, en.y, en.color, 18, 1.3);
                SoundFX.kill();
                enemies.splice(j, 1);
                if (pr.ownerType === 'player') {
                  localPlayer.kills += 1;
                  localPlayer.dashEnergy = Math.min(DASH_ENERGY_MAX, localPlayer.dashEnergy + 20);
                }
              } else {
                SoundFX.hit();
              }
              break;
            }
          }

          if (!hit && pr.ownerType === 'player') {
            for (const npc of npcs) {
              if (Math.hypot(pr.x - npc.x, pr.y - npc.y) < npc.radius + 6) {
                npc.hp -= pr.damage;
                hit = true;
                addDamagePopup(npc.x, npc.y - 14, pr.damage, npc.color, pr.isCrit);
                spawnParticles(pr.x, pr.y, npc.color, 6, 0.8);
                SoundFX.hit();
                break;
              }
            }

            if (!hit) {
              remotePeers.forEach((peer, code) => {
                if (hit || isInSafeZone(peer.x, peer.y)) return;
                if (Math.hypot(pr.x - peer.x, pr.y - peer.y) < (peer.radius || 16) + 6) {
                  peer.hp = Math.max(0, (peer.hp ?? 100) - pr.damage);
                  peer.hitFlash = 1;
                  hit = true;
                  addDamagePopup(peer.x, peer.y - 16, pr.damage, '#fb7185', pr.isCrit);
                  spawnParticles(pr.x, pr.y, peer.color, 7, 0.85);
                  SoundFX.hit();
                  broadcastToAll({
                    type: 'peer_damage',
                    targetCode: code,
                    amount: pr.damage,
                    isCrit: pr.isCrit,
                    color: localPlayer.color
                  });
                }
              });
            }
          }

          if (hit) {
            projectiles.splice(i, 1);
          }
        } else if (pr.ownerType === 'enemy' || pr.ownerType === 'npc') {
          if (Math.hypot(pr.x - localPlayer.x, pr.y - localPlayer.y) < localPlayer.radius + 5 && !localPlayer.inSafeZone && localPlayer.dashTimer <= 0) {
            applyDamageToLocalPlayer(pr.damage, pr.ownerType === 'npc' ? pr.color : '#f43f5e');
            SoundFX.hit();
            projectiles.splice(i, 1);
          }
        }
      }
    }

    function updateSimulation(dt) {
      localPlayer.inSafeZone = isInSafeZone(localPlayer.x, localPlayer.y);
      if (localPlayer.hitFlash > 0) localPlayer.hitFlash = Math.max(0, localPlayer.hitFlash - dt * 5);

      if (localPlayer.powerups.overdrive > 0) localPlayer.powerups.overdrive = Math.max(0, localPlayer.powerups.overdrive - dt);
      if (localPlayer.powerups.aegis > 0) localPlayer.powerups.aegis = Math.max(0, localPlayer.powerups.aegis - dt);
      if (localPlayer.powerups.magnet > 0) localPlayer.powerups.magnet = Math.max(0, localPlayer.powerups.magnet - dt);

      recalculatePlayerStats();
      if (localPlayer.hp < localPlayer.maxHp) {
        const regenRate = localPlayer.inSafeZone ? localPlayer.hpRegen * 2.5 : localPlayer.hpRegen;
        localPlayer.hp = Math.min(localPlayer.maxHp, localPlayer.hp + regenRate * dt);
      }

      if (localPlayer.dashTimer > 0) localPlayer.dashTimer = Math.max(0, localPlayer.dashTimer - dt);
      if (localPlayer.emoteTimer > 0) {
        localPlayer.emoteTimer -= dt;
        if (localPlayer.emoteTimer <= 0) localPlayer.emote = null;
      }

      let moveX = 0;
      let moveY = 0;
      if (keys.has('KeyW') || keys.has('ArrowUp')) moveY -= 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) moveY += 1;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) moveX -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) moveX += 1;
      if (joystickInput.active) {
        moveX += joystickInput.x;
        moveY += joystickInput.y;
      }

      const inputMag = Math.hypot(moveX, moveY);
      if (localPlayer.dashTimer <= 0) {
        if (inputMag > 0.05) {
          const nx = moveX / Math.max(1, inputMag);
          const ny = moveY / Math.max(1, inputMag);
          const scale = Math.min(1, inputMag);
          localPlayer.vx = nx * localPlayer.speed * scale;
          localPlayer.vy = ny * localPlayer.speed * scale;
          localPlayer.aimAngle = Math.atan2(ny, nx);
        } else {
          localPlayer.vx *= Math.pow(0.001, dt);
          localPlayer.vy *= Math.pow(0.001, dt);
        }
      }

      const prevX = localPlayer.x;
      const prevY = localPlayer.y;
      localPlayer.x += localPlayer.vx * dt;
      localPlayer.y += localPlayer.vy * dt;

      ensureInfiniteSectorsAround(localPlayer.x, localPlayer.y);

      const movedDist = Math.hypot(localPlayer.x - prevX, localPlayer.y - prevY);
      if (movedDist > 0.1 && localPlayer.dashTimer <= 0 && localPlayer.dashEnergy < DASH_ENERGY_MAX) {
        localPlayer.dashEnergy = Math.min(DASH_ENERGY_MAX, localPlayer.dashEnergy + movedDist * 0.085);
      }

      if (Math.hypot(localPlayer.vx, localPlayer.vy) > 25) {
        localPlayer.trail.push({ x: localPlayer.x, y: localPlayer.y, alpha: 0.45 });
      }
      for (let i = localPlayer.trail.length - 1; i >= 0; i--) {
        localPlayer.trail[i].alpha -= dt * 1.6;
        if (localPlayer.trail[i].alpha <= 0) localPlayer.trail.splice(i, 1);
      }

      const now = performance.now();
      for (let i = beacons.length - 1; i >= 0; i--) {
        const b = beacons[i];
        if (now - b.createdAt > b.duration) {
          beacons.splice(i, 1);
          continue;
        }
        if (Math.hypot(localPlayer.x - b.x, localPlayer.y - b.y) <= BEACON_RADIUS) {
          localPlayer.hp = Math.min(localPlayer.maxHp, localPlayer.hp + 4.5 * dt);
        }

        let pulled = 0;
        for (const s of shards) {
          if (!s.active) continue;
          const bx = b.x - s.x;
          const by = b.y - s.y;
          const d = Math.hypot(bx, by);
          if (d < BEACON_RADIUS && d > 12) {
            pulled += 1;
            s.x += (bx / d) * 85 * dt;
            s.y += (by / d) * 85 * dt;
          }
        }
        if (pulled >= 3 && !b.bonusClaimed) {
          b.bonusClaimed = true;
          localPlayer.shards += 2;
          localPlayer.dashEnergy = Math.min(DASH_ENERGY_MAX, localPlayer.dashEnergy + 30);
          SoundFX.pickup();
          spawnParticles(b.x, b.y, '#fbbf24', 18, 1.25);
          showToast('Beacon Resonance! +2 Shards & +30% Dash Energy');
        }
      }

      for (const g of gunPickups) {
        if (!g.active) {
          g.respawnTimer -= dt;
          if (g.respawnTimer <= 0) g.active = true;
          continue;
        }
        if (Math.hypot(localPlayer.x - g.x, localPlayer.y - g.y) < localPlayer.radius + 16) {
          g.active = false;
          g.respawnTimer = 26;
          localPlayer.weaponId = g.gunType;
          recalculatePlayerStats();
          localPlayer.ammo = localPlayer.magSize;
          localPlayer.reloadTimer = 0;
          const spec = GUN_SPECS[g.gunType];
          SoundFX.pickup();
          spawnParticles(g.x, g.y, spec.color, 14, 1.0);
          showToast(`Equipped ${spec.label} Gun!`);
        }
      }

      for (const pw of powerupPickups) {
        if (!pw.active) {
          pw.respawnTimer -= dt;
          if (pw.respawnTimer <= 0) pw.active = true;
          continue;
        }
        if (Math.hypot(localPlayer.x - pw.x, localPlayer.y - pw.y) < localPlayer.radius + 16) {
          pw.active = false;
          pw.respawnTimer = 24;
          SoundFX.pickup();
          if (pw.type === 'overdrive') {
            localPlayer.powerups.overdrive = 12;
            spawnParticles(pw.x, pw.y, '#fbbf24', 14, 1.0);
            showToast('Overdrive Active: +35% Fire Rate & +15% Speed');
          } else if (pw.type === 'aegis') {
            localPlayer.powerups.aegis = 12;
            spawnParticles(pw.x, pw.y, '#34d399', 14, 1.0);
            showToast('Aegis Shield Active: 65% Damage Reduction');
          } else {
            localPlayer.powerups.magnet = 14;
            spawnParticles(pw.x, pw.y, '#38bdf8', 14, 1.0);
            showToast('Shard Magnet Active: Pulls Nearby Shards');
          }
        }
      }

      const magnetRadius = localPlayer.powerups.magnet > 0 ? 220 : 0;
      for (const s of shards) {
        s.phase += dt * 3.2;
        if (!s.active) {
          s.respawnTimer -= dt;
          if (s.respawnTimer <= 0) s.active = true;
          continue;
        }
        const dx = localPlayer.x - s.x;
        const dy = localPlayer.y - s.y;
        const dist = Math.hypot(dx, dy);
        if (magnetRadius > 0 && dist < magnetRadius && dist > 8) {
          s.x += (dx / dist) * 190 * dt;
          s.y += (dy / dist) * 190 * dt;
        }
        if (dist < localPlayer.radius + 14) {
          s.active = false;
          s.respawnTimer = 18;
          localPlayer.shards += 1;
          recalculatePlayerStats();
          localPlayer.dashEnergy = Math.min(DASH_ENERGY_MAX, localPlayer.dashEnergy + 15);
          SoundFX.pickup();
          spawnParticles(s.x, s.y, '#fbbf24', 12, 0.9);
          broadcastToAll({ type: 'shard_claim', shardId: s.id });
        }
      }

      updatePlayerAutoCombat(dt);
      updateNPCs(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      updateCombatAndEnergyUI();

      remotePeers.forEach((peer) => {
        const pPrevX = peer.x;
        const pPrevY = peer.y;
        const lerpFactor = 1 - Math.exp(-12 * dt);
        peer.x += (peer.targetX - peer.x) * lerpFactor;
        peer.y += (peer.targetY - peer.y) * lerpFactor;
        if (typeof peer.hp !== 'number') peer.hp = 100;
        if (typeof peer.maxHp !== 'number') peer.maxHp = 100;
        if (peer.hitFlash > 0) peer.hitFlash = Math.max(0, peer.hitFlash - dt * 5);
        if (Math.hypot(peer.x - pPrevX, peer.y - pPrevY) > 0.6) {
          peer.trail.push({ x: peer.x, y: peer.y, alpha: 0.35 });
        }
        for (let i = peer.trail.length - 1; i >= 0; i--) {
          peer.trail[i].alpha -= dt * 1.6;
          if (peer.trail[i].alpha <= 0) peer.trail.splice(i, 1);
        }
        if (peer.emoteTimer > 0) {
          peer.emoteTimer -= dt;
          if (peer.emoteTimer <= 0) peer.emote = null;
        }
      });

      for (let i = damagePopups.length - 1; i >= 0; i--) {
        const dp = damagePopups[i];
        dp.y += dp.vy * dt;
        dp.life -= dt;
        if (dp.life <= 0) damagePopups.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.pow(0.08, dt);
        p.vy *= Math.pow(0.08, dt);
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      document.getElementById('coordsText').textContent = `${Math.round(localPlayer.x)}, ${Math.round(localPlayer.y)}`;
    }

    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimapCanvas');
    const minimapCtx = minimapCanvas ? minimapCanvas.getContext('2d') : null;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawWorld() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const camX = localPlayer.x - width / 2;
      const camY = localPlayer.y - height / 2;
      const biome = getBiomeAt(localPlayer.x, localPlayer.y);

      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(-camX, -camY);

      ctx.save();
      ctx.fillStyle = 'rgba(16, 185, 129, 0.06)';
      ctx.beginPath();
      ctx.arc(0, 0, SAFE_ZONE_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(52, 211, 153, 0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.arc(0, 0, SAFE_ZONE_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(110, 231, 183, 0.75)';
      ctx.font = '700 11px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SAFE SANCTUARY • WEAPONS DISABLED', 0, -SAFE_ZONE_RADIUS + 18);
      ctx.restore();

      const gridStep = 100;
      const startX = Math.floor(camX / gridStep) * gridStep;
      const endX = camX + width + gridStep;
      const startY = Math.floor(camY / gridStep) * gridStep;
      const endY = camY + height + gridStep;

      ctx.strokeStyle = biome.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let gx = startX; gx <= endX; gx += gridStep) {
        ctx.moveTo(gx, startY);
        ctx.lineTo(gx, endY);
      }
      for (let gy = startY; gy <= endY; gy += gridStep) {
        ctx.moveTo(startX, gy);
        ctx.lineTo(endX, gy);
      }
      ctx.stroke();

      const startSecX = Math.floor(camX / SECTOR_SIZE) * SECTOR_SIZE;
      const endSecX = camX + width + SECTOR_SIZE;
      const startSecY = Math.floor(camY / SECTOR_SIZE) * SECTOR_SIZE;
      const endSecY = camY + height + SECTOR_SIZE;

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.09)';
      ctx.lineWidth = 1.5;
      for (let sx = startSecX; sx <= endSecX; sx += SECTOR_SIZE) {
        for (let sy = startSecY; sy <= endSecY; sy += SECTOR_SIZE) {
          ctx.strokeRect(sx, sy, SECTOR_SIZE, SECTOR_SIZE);
          const b = getBiomeAt(sx + 10, sy + 10);
          ctx.fillStyle = 'rgba(148, 163, 184, 0.22)';
          ctx.font = '600 11px Inter, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(`${b.name} (${Math.floor(sx / SECTOR_SIZE)}, ${Math.floor(sy / SECTOR_SIZE)})`, sx + 12, sy + 20);
        }
      }

      const now = performance.now();
      for (const b of beacons) {
        const elapsed = now - b.createdAt;
        const pulse = 0.5 + 0.5 * Math.sin(elapsed * 0.008);
        ctx.save();
        ctx.strokeStyle = b.color;
        ctx.globalAlpha = 0.35 + pulse * 0.35;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(b.x, b.y, BEACON_RADIUS, 0, Math.PI * 2);
        ctx.stroke();

        ctx.globalAlpha = 0.07 + pulse * 0.05;
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 1;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 7 + pulse * 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.font = '600 11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`Beacon • ${b.label}`, b.x, b.y - 16);
        ctx.restore();
      }

      for (const s of shards) {
        if (!s.active) continue;
        if (s.x < camX - 30 || s.x > camX + width + 30 || s.y < camY - 30 || s.y > camY + height + 30) continue;
        const bob = Math.sin(s.phase) * 3;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(s.x, s.y - 9 + bob);
        ctx.lineTo(s.x + 8, s.y + bob);
        ctx.lineTo(s.x, s.y + 9 + bob);
        ctx.lineTo(s.x - 8, s.y + bob);
        ctx.closePath();
        ctx.fill();
      }

      for (const g of gunPickups) {
        if (!g.active) continue;
        const spec = GUN_SPECS[g.gunType] || GUN_SPECS.pulse;
        ctx.fillStyle = spec.color;
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(g.x - 10, g.y - 6, 20, 12, 4);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#f8fafc';
        ctx.font = '700 10px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(spec.label, g.x, g.y - 12);
      }

      for (const pw of powerupPickups) {
        if (!pw.active) continue;
        const pColor = pw.type === 'overdrive' ? '#fbbf24' : pw.type === 'aegis' ? '#34d399' : '#38bdf8';
        const pTag = pw.type === 'overdrive' ? '⚡ OVERDRIVE' : pw.type === 'aegis' ? '🛡️ AEGIS' : '🧲 MAGNET';
        ctx.fillStyle = pColor;
        ctx.beginPath();
        ctx.arc(pw.x, pw.y, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f8fafc';
        ctx.font = '700 10px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(pTag, pw.x, pw.y - 14);
      }

      for (const en of enemies) {
        if (en.x < camX - 60 || en.x > camX + width + 60 || en.y < camY - 60 || en.y > camY + height + 60) continue;
        ctx.fillStyle = (en.hitFlash && en.hitFlash > 0) ? '#ffffff' : en.color;
        ctx.strokeStyle = '#1f0912';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const bw = Math.max(24, en.radius * 1.6);
        const ratio = Math.max(0, en.hp / en.maxHp);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(en.x - bw / 2, en.y - en.radius - 12, bw, 4);
        ctx.fillStyle = en.color;
        ctx.fillRect(en.x - bw / 2, en.y - en.radius - 12, bw * ratio, 4);

        ctx.fillStyle = '#fecdd3';
        ctx.font = '600 10px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(en.variant, en.x, en.y - en.radius - 16);
      }

      for (const pr of projectiles) {
        ctx.fillStyle = pr.color;
        ctx.beginPath();
        ctx.arc(pr.x, pr.y, pr.isCrit ? 5.5 : 4, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const dp of damagePopups) {
        ctx.globalAlpha = Math.max(0, dp.life / dp.maxLife);
        ctx.fillStyle = dp.color;
        ctx.font = '800 12px JetBrains Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(dp.text, dp.x, dp.y);
      }
      ctx.globalAlpha = 1;

      for (const npc of npcs) drawExplorerEntity(npc, false, true);
      remotePeers.forEach((peer) => drawExplorerEntity(peer, false, false));
      drawExplorerEntity(localPlayer, true, false);

      ctx.restore();
      drawMinimap();
    }

    function drawExplorerEntity(entity, isLocal, isNpc = false) {
      for (const t of entity.trail) {
        ctx.globalAlpha = Math.max(0, t.alpha * 0.45);
        ctx.fillStyle = entity.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, (entity.radius || 16) * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      const r = entity.radius || 16;
      ctx.fillStyle = (entity.hitFlash && entity.hitFlash > 0) ? '#ffffff' : (entity.color || '#38bdf8');
      ctx.strokeStyle = isLocal ? '#ffffff' : '#0f172a';
      ctx.lineWidth = isLocal ? 2.5 : 1.75;
      ctx.beginPath();
      ctx.arc(entity.x, entity.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (isLocal && localPlayer.powerups.aegis > 0) {
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(entity.x, entity.y, r + 6, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = '#090d16';
      ctx.beginPath();
      ctx.arc(entity.x, entity.y, r * 0.35, 0, Math.PI * 2);
      ctx.fill();

      if (!isLocal && typeof entity.hp === 'number' && typeof entity.maxHp === 'number' && entity.maxHp > 0) {
        const bw = 34;
        const ratio = Math.max(0, Math.min(1, entity.hp / entity.maxHp));
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(entity.x - bw / 2, entity.y - r - 11, bw, 4);
        ctx.fillStyle = isNpc ? entity.color : '#fb7185';
        ctx.fillRect(entity.x - bw / 2, entity.y - r - 11, bw * ratio, 4);
      }

      ctx.fillStyle = isNpc ? '#cbd5e1' : '#f8fafc';
      ctx.font = `${isLocal ? '700' : '600'} 12px Inter, sans-serif`;
      ctx.textAlign = 'center';
      const yOffset = isLocal ? r + 10 : r + 16;
      const label = isLocal
        ? `${entity.name} [${entity.shortCode}]`
        : isNpc
          ? `${entity.code} • ${entity.role}`
          : `${entity.name} [${entity.shortCode}]`;
      ctx.fillText(label, entity.x, entity.y - yOffset);

      if (entity.emote) {
        ctx.font = '22px sans-serif';
        ctx.fillText(entity.emote, entity.x, entity.y - yOffset - 18);
      }
    }

    function drawMinimap() {
      if (!minimapCtx) return;
      const mw = minimapCanvas.width;
      const mh = minimapCanvas.height;
      const range = 1600;
      const scale = (mw * 0.5) / range;

      minimapCtx.clearRect(0, 0, mw, mh);
      minimapCtx.fillStyle = '#070b14';
      minimapCtx.fillRect(0, 0, mw, mh);

      const safeScreenX = mw / 2 + (0 - localPlayer.x) * scale;
      const safeScreenY = mh / 2 + (0 - localPlayer.y) * scale;
      minimapCtx.strokeStyle = 'rgba(52, 211, 153, 0.45)';
      minimapCtx.lineWidth = 1;
      minimapCtx.beginPath();
      minimapCtx.arc(safeScreenX, safeScreenY, Math.max(2, SAFE_ZONE_RADIUS * scale), 0, Math.PI * 2);
      minimapCtx.stroke();

      for (const en of enemies) {
        const mx = mw / 2 + (en.x - localPlayer.x) * scale;
        const my = mh / 2 + (en.y - localPlayer.y) * scale;
        if (mx < 0 || mx > mw || my < 0 || my > mh) continue;
        minimapCtx.fillStyle = en.color;
        minimapCtx.beginPath();
        minimapCtx.arc(mx, my, en.variant === 'Colossus' ? 3.5 : 2, 0, Math.PI * 2);
        minimapCtx.fill();
      }

      for (const npc of npcs) {
        const mx = mw / 2 + (npc.x - localPlayer.x) * scale;
        const my = mh / 2 + (npc.y - localPlayer.y) * scale;
        if (mx < 0 || mx > mw || my < 0 || my > mh) continue;
        minimapCtx.fillStyle = npc.color;
        minimapCtx.beginPath();
        minimapCtx.arc(mx, my, 2.5, 0, Math.PI * 2);
        minimapCtx.fill();
      }

      remotePeers.forEach((peer) => {
        const mx = mw / 2 + (peer.x - localPlayer.x) * scale;
        const my = mh / 2 + (peer.y - localPlayer.y) * scale;
        if (mx < 0 || mx > mw || my < 0 || my > mh) return;
        minimapCtx.fillStyle = peer.color;
        minimapCtx.beginPath();
        minimapCtx.arc(mx, my, 3.2, 0, Math.PI * 2);
        minimapCtx.fill();
      });

      minimapCtx.fillStyle = '#ffffff';
      minimapCtx.beginPath();
      minimapCtx.arc(mw / 2, mh / 2, 3.5, 0, Math.PI * 2);
      minimapCtx.fill();
    }

    function bindEvents() {
      window.addEventListener('resize', resizeCanvas);

      window.addEventListener('keydown', (e) => {
        if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        keys.add(e.code);
        if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
          e.preventDefault();
          triggerDash();
        } else if (e.code === 'KeyE') {
          triggerBeacon();
        }
      });

      window.addEventListener('keyup', (e) => {
        keys.delete(e.code);
      });

      document.getElementById('dashBtn').addEventListener('click', triggerDash);
      document.getElementById('beaconBtn').addEventListener('click', triggerBeacon);

      document.getElementById('copyIdBtn').addEventListener('click', () => {
        const code = localPlayer.shortCode;
        if (!code || code === '----') return;
        const helper = document.createElement('textarea');
        helper.value = code;
        helper.style.position = 'fixed';
        helper.style.opacity = '0';
        document.body.appendChild(helper);
        helper.select();
        try {
          document.execCommand('copy');
          showToast(`Copied 4-digit ID: ${code}`);
        } catch (err) {
          showToast(`Your 4-digit ID: ${code}`);
        }
        document.body.removeChild(helper);
      });

      const codeInput = document.getElementById('remoteCodeInput');
      codeInput.addEventListener('input', () => {
        codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 4);
      });
      codeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          connectToPeer(codeInput.value);
        }
      });

      document.getElementById('connectPeerBtn').addEventListener('click', () => {
        connectToPeer(codeInput.value);
      });

      const soundBtn = document.getElementById('soundToggleBtn');
      const soundOn = document.getElementById('soundOnIcon');
      const soundOff = document.getElementById('soundOffIcon');
      soundBtn.addEventListener('click', () => {
        const next = !SoundFX.isEnabled();
        SoundFX.setEnabled(next);
        soundOn.classList.toggle('hidden', !next);
        soundOff.classList.toggle('hidden', next);
        showToast(next ? 'Sound effects enabled' : 'Sound effects muted');
      });

      const drawer = document.getElementById('chatDrawer');
      const unreadBadge = document.getElementById('unreadBadge');
      document.getElementById('chatToggleBtn').addEventListener('click', () => {
        drawer.classList.toggle('hidden');
        if (!drawer.classList.contains('hidden')) {
          unreadBadge.classList.add('hidden');
          document.getElementById('chatInput').focus();
        }
      });
      document.getElementById('closeChatBtn').addEventListener('click', () => {
        drawer.classList.add('hidden');
      });

      document.getElementById('chatForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        SoundFX.message();
        appendChatMessage({
          sender: localPlayer.name,
          code: localPlayer.shortCode,
          text,
          color: localPlayer.color,
          self: true
        });
        broadcastToAll({ type: 'chat', text });
      });

      document.querySelectorAll('.emote-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          sendEmote(btn.dataset.emote);
        });
      });

      const zone = document.getElementById('joystickZone');
      const knob = document.getElementById('joystickKnob');
      let joyTouchId = null;
      const maxRadius = 34;

      function updateKnob(clientX, clientY) {
        const rect = zone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > maxRadius) {
          dx = (dx / dist) * maxRadius;
          dy = (dy / dist) * maxRadius;
        }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickInput.x = dx / maxRadius;
        joystickInput.y = dy / maxRadius;
        joystickInput.active = true;
      }

      function resetKnob() {
        joyTouchId = null;
        joystickInput.active = false;
        joystickInput.x = 0;
        joystickInput.y = 0;
        knob.style.transform = 'translate(0px, 0px)';
      }

      zone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        joyTouchId = t.identifier;
        updateKnob(t.clientX, t.clientY);
      }, { passive: false });

      zone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === joyTouchId) {
            updateKnob(t.clientX, t.clientY);
            break;
          }
        }
      }, { passive: false });

      zone.addEventListener('touchend', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joyTouchId) {
            resetKnob();
            break;
          }
        }
      });
      zone.addEventListener('touchcancel', resetKnob);
    }

    let lastFrameTime = performance.now();
    let lastBroadcastTime = 0;

    function mainLoop(now) {
      const dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
      lastFrameTime = now;

      updateSimulation(dt);
      drawWorld();

      if (now - lastBroadcastTime >= BROADCAST_INTERVAL_MS && dataConnections.size > 0) {
        lastBroadcastTime = now;
        broadcastToAll({
          type: 'state',
          name: localPlayer.name,
          color: localPlayer.color,
          x: localPlayer.x,
          y: localPlayer.y,
          shards: localPlayer.shards,
          hp: Math.round(localPlayer.hp),
          maxHp: Math.round(localPlayer.maxHp),
          hit: localPlayer.hitFlash > 0.4
        });
      }

      requestAnimationFrame(mainLoop);
    }

    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      initNPCs();
      recalculatePlayerStats();
      ensureInfiniteSectorsAround(localPlayer.x, localPlayer.y);
      bindEvents();
      updateCombatAndEnergyUI();
      initPeer();
      requestAnimationFrame(mainLoop);
    });
  </script>
</body>
</html>
